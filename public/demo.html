<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot test page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 0 16px; color: #222; line-height: 1.6; background: #fff; }
    .box { background: #f3f3f6; border-radius: 10px; padding: 14px 16px; }
  </style>
</head>
<body>
  <h1>Chatbot test page</h1>
  <p>This page stands in for your website. Click the chat bubble in the bottom corner to talk to your bot.</p>
  <p class="box" id="note"></p>
  <p><button onclick="window.Chatbot && Chatbot.send('What can you help me with?')">Ask the bot from a page button</button></p>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("bot");
      var note = document.getElementById("note");
      if (!id) { note.textContent = "Open this page from the admin page's \"Open test page\" button."; return; }
      note.textContent = "Testing bot " + id + ". Conversations from this page show up in the admin page too.";
      var s = document.createElement("script");
      s.src = "/widget.js"; s.defer = true; s.setAttribute("data-bot-id", id);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
